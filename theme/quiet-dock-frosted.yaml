# Quiet Dock: frosted glass pill
# For the "Windows 11 Taskbar Styler" Windhawk mod: Settings > Textual mode,
# paste this whole file, Save settings.
# Pair with "Taskbar height and icon size" at the values in
# taskbar-height.yaml: the extra height is the empty strip above the pill that
# magnified icons grow into instead of being clipped.
# Selectors adapted from the FrostyGlass theme by Guido Lamanna
# (windows-11-taskbar-styling-guide).
styleConstants:
  # Blur follows light/dark mode. Falls back to the flat FallbackColor when
  # transparency effects or battery saver are on.
  - Glass=<WindhawkBlur BlurAmount="28" TintColor="{ThemeResource SystemChromeMediumColor}" TintOpacity="0.55" NoiseOpacity="0.02" FallbackColor="{ThemeResource SystemChromeMediumColor}" />
  # Hairline edge, brighter on top like macOS's dock.
  - Edge=<LinearGradientBrush StartPoint="0,0" EndPoint="0,1"><GradientStop Color="#40FFFFFF" Offset="0" /><GradientStop Color="#18FFFFFF" Offset="0.5" /><GradientStop Color="#10FFFFFF" Offset="1" /></LinearGradientBrush>
  - Radius=16
  # Top margin = headroom for magnified icons; bottom margin = float gap.
  - PillMargin=0,16,0,6
controlStyles:
  # Make the full-width taskbar strip invisible; only the pills show.
  - target: Taskbar.TaskbarBackground#BackgroundControl > Windows.UI.Xaml.Controls.Grid > Windows.UI.Xaml.Shapes.Rectangle#BackgroundFill
    styles:
      - Visibility=Collapsed
  - target: Taskbar.TaskbarFrame > Grid#RootGrid > Taskbar.TaskbarBackground > Grid > Rectangle#BackgroundFill
    styles:
      - Visibility=Collapsed
  - target: Rectangle#BackgroundStroke
    styles:
      - Visibility=Collapsed
  # The dock: wrap the icons and center them.
  - target: Taskbar.TaskbarFrame > Grid#RootGrid@DockingStates
    styles:
      - Tag=horizontal
      - Tag@DockedLeft=vertical
      - Tag@DockedRight=vertical
      - Tag=>taskbarDock
  - target: Taskbar.TaskbarFrame
    styles:
      - HorizontalAlignment=Center
      - Width={{taskbarDock==`vertical`?skip():`Auto`}}
  - target: Taskbar.TaskbarFrame > Grid#RootGrid
    styles:
      - Margin=$PillMargin
      - Padding=6,0,6,0
      - CornerRadius=$Radius
      - Background:=$Glass
      - BorderThickness=1
      - BorderBrush:=$Edge
  # Tray and clock: a matching small pill on the right.
  - target: StackPanel#SystemTrayFrameGrid, Grid#SystemTrayFrameGrid
    styles:
      - Margin=8,16,8,6
      - Padding=4,0,4,0
      - CornerRadius=$Radius
      - Background:=$Glass
      - BorderThickness=1
      - BorderBrush:=$Edge
      - BackgroundSizing=InnerBorderEdge
  - target: SystemTray.SystemTrayFrame
    styles:
      - HorizontalAlignment=Right
      - Width=Auto
  # Running apps get a small dot instead of the Windows underline.
  - target: Taskbar.TaskListLabeledButtonPanel@RunningIndicatorStates > Rectangle#RunningIndicator
    styles:
      - Width=5
      - Height=5
      - RadiusX=2.5
      - RadiusY=2.5
      - Fill:=<SolidColorBrush Color="{ThemeResource SystemBaseHighColor}" Opacity="0.6" />
  # Rounder hover highlight, to match the pill.
  - target: Taskbar.TaskListButton
    styles:
      - CornerRadius=10
  # Flyouts and tooltips opened from the dock use the same glass.
  - target: Border#HoverFlyoutBackground
    styles:
      - Background:=$Glass
      - BorderBrush:=$Edge
      - BorderThickness=1
      - CornerRadius=$Radius
  - target: Taskbar.TaskbarBackground#HoverFlyoutBackgroundControl > Grid > Rectangle#BackgroundFill
    styles:
      - Fill:=Transparent
  - target: Windows.UI.Xaml.Controls.ToolTip > Windows.UI.Xaml.Controls.ContentPresenter#LayoutRoot
    styles:
      - Background:=$Glass
      - BorderBrush:=$Edge
      - BorderThickness=1
      - CornerRadius=10
